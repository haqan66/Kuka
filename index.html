<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kuka Kazan</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a0f2e;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0619;
      }
      #game-canvas {
        display: block;
        image-rendering: -webkit-optimize-contrast;
        touch-action: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffd166;
        font-size: 20px;
        letter-spacing: 2px;
        background: radial-gradient(circle at 50% 40%, #2a1550, #0d0619);
        z-index: 999;
      }
    
</style>
</head>
<body>
<div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="loading">KUKA KAZAN yükleniyor...</div>
    </div>
<script type="module" src="./src/kuka-kazan.js"></script>
</body>
</html>
